name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mem]"
      - run: python -m pytest -q
      - name: offline quickstart (mock backend)
        shell: bash
        env:
          DIRECTOR_HOME: ${{ runner.temp }}/d2home
        run: |
          director init
          director doctor
          director new "ci mission" -o "smoke test the command loop"
          director status
          director evolve run topk
